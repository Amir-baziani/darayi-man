<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-title" content="دارایی من" />

  <link rel="manifest" href="./manifest.json" />

  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>دارایی من | مدیریت مالی شخصی</title>
  <style>
    @font-face { font-family: Vazirmatn; src: local('Vazirmatn'), local('Vazirmatn Regular'); font-style: normal; font-display: swap; }

    :root {
      --bg: #edf2fb;
      --bg-2: #f8fbff;
      --surface: rgba(255,255,255,.58);
      --surface-strong: rgba(255,255,255,.78);
      --surface-soft: rgba(255,255,255,.36);
      --border: rgba(255,255,255,.64);
      --border-soft: rgba(15,23,42,.08);
      --text: #0f172a;
      --muted: #64748b;
      --faint: #94a3b8;
      --accent: #5b5cf0;
      --accent-2: #8b5cf6;
      --accent-soft: rgba(91,92,240,.14);
      --success: #079669;
      --success-soft: rgba(16,185,129,.13);
      --danger: #e5475c;
      --danger-soft: rgba(239,68,68,.13);
      --warning: #d98b0b;
      --warning-soft: rgba(245,158,11,.14);
      --info: #1687d9;
      --shadow: 0 24px 70px rgba(51,65,85,.16), 0 2px 12px rgba(15,23,42,.06);
      --shadow-soft: 0 12px 35px rgba(51,65,85,.10);
      --blur: 28px;
      --radius-xl: 30px;
      --radius-lg: 23px;
      --radius-md: 17px;
      --radius-sm: 12px;
      --sidebar: 272px;
      --header: 82px;
      --ease: cubic-bezier(.2,.8,.2,1);
    }

    html[data-theme="dark"] {
      --bg: #060914;
      --bg-2: #0b1020;
      --surface: rgba(16,24,43,.58);
      --surface-strong: rgba(20,30,52,.82);
      --surface-soft: rgba(18,27,47,.38);
      --border: rgba(255,255,255,.11);
      --border-soft: rgba(255,255,255,.07);
      --text: #f7f9ff;
      --muted: #a9b4c8;
      --faint: #7f8aa0;
      --accent: #8b8cff;
      --accent-2: #b084ff;
      --accent-soft: rgba(139,140,255,.16);
      --success: #39d39a;
      --success-soft: rgba(16,185,129,.14);
      --danger: #ff6b7c;
      --danger-soft: rgba(255,107,124,.14);
      --warning: #ffc15a;
      --warning-soft: rgba(255,193,90,.14);
      --info: #63b3ed;
      --shadow: 0 30px 90px rgba(0,0,0,.42), 0 2px 12px rgba(0,0,0,.18);
      --shadow-soft: 0 16px 48px rgba(0,0,0,.26);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 10%, rgba(91,92,240,.21), transparent 28%),
        radial-gradient(circle at 88% 18%, rgba(16,185,129,.14), transparent 26%),
        radial-gradient(circle at 60% 90%, rgba(168,85,247,.14), transparent 30%),
        linear-gradient(150deg, var(--bg), var(--bg-2));
      font-family: Vazirmatn, Tahoma, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      inset: auto;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .35;
      pointer-events: none;
      z-index: -1;
      animation: floatBlob 14s var(--ease) infinite alternate;
    }
    body::before { top: -120px; left: -100px; background: #7c3aed; }
    body::after { bottom: -150px; right: -100px; background: #06b6d4; animation-delay: -5s; }
    @keyframes floatBlob { to { transform: translate3d(40px, 28px, 0) scale(1.08); } }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--accent-soft); color: var(--text); }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: rgba(127,138,160,.38); border-radius: 20px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-track { background: transparent; }

    .glass {
      background: linear-gradient(145deg, var(--surface-strong), var(--surface));
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(var(--blur)) saturate(150%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
    }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) 1fr; }
    .sidebar {
      position: fixed;
      inset: 18px 18px 18px auto;
      width: calc(var(--sidebar) - 36px);
      height: calc(100vh - 36px);
      border-radius: var(--radius-xl);
      z-index: 40;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 18px;
      transition: transform .45s var(--ease), opacity .3s ease;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 7px 5px 18px; }
    .brand-logo {
      width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center;
      color: white; box-shadow: 0 14px 30px rgba(91,92,240,.35);
      background: linear-gradient(145deg, #8b8cff, #5b5cf0 60%, #7447d4);
      position: relative; overflow: hidden;
    }
    .brand-logo::after { content:""; position:absolute; inset:3px 4px auto; height:38%; border-radius:14px; background:linear-gradient(180deg,rgba(255,255,255,.44),transparent); }
    .brand-logo svg { width: 25px; height: 25px; position: relative; z-index: 1; }
    .brand h1 { margin:0; font-size: 16px; font-weight: 800; }
    .brand p { margin:2px 0 0; font-size: 11px; color: var(--muted); }
    .nav { display: grid; gap: 6px; overflow-y: auto; padding: 5px 0; }
    .nav-btn {
      border: 0; background: transparent; cursor: pointer; border-radius: 15px; padding: 11px 12px;
      display: flex; align-items: center; gap: 11px; color: var(--muted); transition: .25s var(--ease); text-align: right;
    }
    .nav-btn svg { width: 20px; height: 20px; flex: 0 0 auto; }
    .nav-btn:hover { background: var(--surface-soft); color: var(--text); transform: translateX(-2px); }
    .nav-btn.active { color: var(--accent); background: var(--accent-soft); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(139,140,255,.13); }
    .sidebar-footer { margin-top: auto; padding-top: 14px; }
    .storage-card { padding: 13px; border-radius: 17px; background: var(--surface-soft); border: 1px solid var(--border-soft); }
    .storage-line { display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--muted); margin-bottom:8px; }
    .progress { height: 7px; border-radius: 99px; overflow: hidden; background: rgba(127,138,160,.16); }
    .progress > i { display:block; height:100%; border-radius:inherit; width:0; background: linear-gradient(90deg,var(--accent),var(--accent-2)); transition: width .6s var(--ease); }

    .main { grid-column: 2; min-width: 0; padding: 18px 18px 110px 0; }
    .topbar {
      position: sticky; top: 18px; z-index: 30; min-height: 68px; border-radius: 23px; padding: 10px 14px;
      display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
    }
    .mobile-menu { display:none !important; }
    .page-heading { min-width:0; margin-left:auto; }
    .page-heading h2 { margin:0; font-size: clamp(18px,2vw,24px); font-weight: 850; letter-spacing:-.4px; }
    .page-heading p { margin:2px 0 0; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .top-actions { display:flex; align-items:center; gap:8px; }
    .icon-btn, .btn {
      border: 1px solid var(--border); background: var(--surface-soft); cursor:pointer; border-radius:14px; min-height:42px;
      display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.25s var(--ease); box-shadow:0 5px 18px rgba(15,23,42,.04);
    }
    .icon-btn { width:42px; padding:0; }
    .btn { padding: 9px 14px; font-weight:700; }
    .icon-btn svg, .btn svg { width:19px; height:19px; }
    .icon-btn:hover, .btn:hover { transform: translateY(-2px); background: var(--surface-strong); box-shadow: var(--shadow-soft); }
    .icon-btn:active, .btn:active { transform:scale(.97); }
    .btn-primary { color:#fff; border-color:transparent; background:linear-gradient(145deg,var(--accent),var(--accent-2)); box-shadow:0 12px 28px rgba(91,92,240,.25); }
    .btn-primary:hover { background:linear-gradient(145deg,var(--accent),var(--accent-2)); filter:brightness(1.05); }
    .btn-danger { color:var(--danger); background:var(--danger-soft); border-color:rgba(239,68,68,.12); }
    .btn-success { color:var(--success); background:var(--success-soft); }
    .btn-ghost { background:transparent; box-shadow:none; border-color:transparent; }
    .btn-sm { min-height:34px; padding:6px 10px; border-radius:11px; font-size:12px; }
    .badge { display:inline-flex; align-items:center; gap:5px; padding:5px 9px; border-radius:99px; font-size:11px; font-weight:700; background:var(--surface-soft); border:1px solid var(--border-soft); }
    .badge.success{color:var(--success);background:var(--success-soft)} .badge.danger{color:var(--danger);background:var(--danger-soft)} .badge.warning{color:var(--warning);background:var(--warning-soft)} .badge.info{color:var(--info);background:rgba(22,135,217,.12)}

    .content { animation: viewIn .42s var(--ease); }
    @keyframes viewIn { from { opacity:0; transform:translateY(10px) scale(.995); } }
    .grid { display:grid; gap:16px; }
    .grid-4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .grid-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .grid-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .span-2 { grid-column:span 2; }
    .card { border-radius:var(--radius-lg); padding:18px; min-width:0; }
    .card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .card-title { margin:0; font-size:15px; font-weight:800; }
    .card-subtitle { margin:3px 0 0; color:var(--muted); font-size:11px; }
    .stat-card { position:relative; overflow:hidden; min-height:148px; }
    .stat-card::after { content:""; position:absolute; width:90px;height:90px;border-radius:50%; left:-25px;bottom:-35px; background:var(--tint,var(--accent-soft)); filter:blur(8px); }
    .stat-icon { width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--tint,var(--accent-soft));color:var(--tone,var(--accent)); }
    .stat-icon svg { width:21px;height:21px; }
    .stat-label { margin-top:13px;color:var(--muted);font-size:12px; }
    .stat-value { margin-top:3px;font-size:clamp(18px,2vw,27px);font-weight:900;letter-spacing:-.7px; direction:rtl; }
    .stat-meta { margin-top:6px;color:var(--muted);font-size:11px; }
    .positive{color:var(--success)!important}.negative{color:var(--danger)!important}.muted{color:var(--muted)!important}

    .quick-actions { display:grid;grid-template-columns:repeat(3,1fr);gap:10px; }
    .quick-action { padding:14px 10px;border-radius:17px;text-align:center;border:1px solid var(--border-soft);background:var(--surface-soft);cursor:pointer;transition:.25s var(--ease); }
    .quick-action:hover { transform:translateY(-3px);box-shadow:var(--shadow-soft); }
    .quick-action .qicon { width:40px;height:40px;border-radius:14px;display:grid;place-items:center;margin:0 auto 8px; }
    .quick-action svg{width:20px;height:20px}.quick-action span{font-size:12px;font-weight:700}.q-income{background:var(--success-soft);color:var(--success)}.q-expense{background:var(--danger-soft);color:var(--danger)}.q-transfer{background:var(--accent-soft);color:var(--accent)}

    .list { display:grid; gap:9px; }
    .list-row { display:flex;align-items:center;gap:11px;padding:11px;border-radius:16px;background:var(--surface-soft);border:1px solid var(--border-soft);transition:.22s var(--ease); }
    .list-row:hover { transform:translateX(-2px); background:var(--surface-strong); }
    .row-icon { width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;font-size:19px;background:var(--icon-bg,var(--accent-soft)); color:var(--icon-color,var(--accent)); }
    .row-main { min-width:0;flex:1; }
    .row-title { font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .row-sub { margin-top:2px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .row-side { text-align:left;flex:0 0 auto; }
    .row-amount { font-size:13px;font-weight:850; }
    .row-secondary { margin-top:2px;font-size:9px;color:var(--faint); }
    .row-actions { display:flex;gap:4px;opacity:.25;transition:.2s; }
    .list-row:hover .row-actions { opacity:1; }
    .mini-btn { width:31px;height:31px;border:0;border-radius:10px;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted);transition:.2s; }
    .mini-btn:hover{background:var(--surface-soft);color:var(--text)} .mini-btn.danger:hover{background:var(--danger-soft);color:var(--danger)} .mini-btn svg{width:16px;height:16px}

    .empty { text-align:center;padding:38px 18px;color:var(--muted); }
    .empty-icon { width:64px;height:64px;border-radius:22px;display:grid;place-items:center;margin:0 auto 13px;background:var(--accent-soft);color:var(--accent); }
    .empty-icon svg{width:30px;height:30px}.empty h3{margin:0 0 5px;color:var(--text);font-size:15px}.empty p{margin:0 auto 14px;max-width:360px;font-size:12px;line-height:1.9}

    .toolbar { display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px; }
    .search-box { position:relative;flex:1;min-width:210px; }
    .search-box svg { position:absolute;right:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none; }
    .field, .select, .textarea {
      width:100%;border:1px solid var(--border-soft);background:var(--surface-soft);color:var(--text);border-radius:14px;outline:none;transition:.22s;padding:11px 13px;
    }
    .search-box .field { padding-right:40px; }
    .field:focus,.select:focus,.textarea:focus{border-color:rgba(91,92,240,.45);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface-strong)}
    .select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:16px calc(50% - 2px),11px calc(50% - 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-left:32px}
    .textarea{min-height:92px;resize:vertical;line-height:1.8}.field::placeholder,.textarea::placeholder{color:var(--faint)}
    .filter-select { width:auto; min-width:145px; }

    .table-wrap { overflow:auto;border-radius:16px;border:1px solid var(--border-soft); }
    table { width:100%;border-collapse:collapse;min-width:760px;background:var(--surface-soft); }
    th,td { padding:12px 13px;text-align:right;border-bottom:1px solid var(--border-soft);font-size:12px;white-space:nowrap; }
    th { color:var(--muted);font-size:10px;font-weight:700;background:var(--surface-soft);position:sticky;top:0;z-index:1; }
    tbody tr{transition:.18s}tbody tr:hover{background:var(--surface-strong)}tbody tr:last-child td{border-bottom:0}

    .account-card { position:relative;overflow:hidden;min-height:160px;background:linear-gradient(145deg,var(--card-color,#5b5cf0),color-mix(in srgb,var(--card-color,#5b5cf0) 72%,#111827));color:white;border:0;box-shadow:0 18px 42px color-mix(in srgb,var(--card-color,#5b5cf0) 30%,transparent); }
    .account-card::before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;left:-55px;top:-80px;background:rgba(255,255,255,.15);filter:blur(2px)}
    .account-card::after{content:"";position:absolute;inset:1px;border-radius:calc(var(--radius-lg) - 1px);border:1px solid rgba(255,255,255,.18);pointer-events:none}
    .account-top,.account-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}.account-name{font-size:13px;font-weight:700}.account-kind{font-size:10px;opacity:.72}.account-balance{position:relative;z-index:1;font-size:23px;font-weight:900;margin:20px 0 15px;direction:rtl}.account-bottom{font-size:10px;opacity:.82}.account-symbol{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.17);backdrop-filter:blur(10px)}

    .meter { margin-top:12px; }
    .meter-head { display:flex;justify-content:space-between;gap:10px;font-size:11px;margin-bottom:7px; }
    .meter-track { height:10px;border-radius:99px;background:rgba(127,138,160,.14);overflow:hidden; }
    .meter-fill { height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--meter-color,var(--accent)),color-mix(in srgb,var(--meter-color,var(--accent)) 70%,white));transition:width .7s var(--ease); }
    .budget-card.over .meter-fill{background:linear-gradient(90deg,var(--danger),#fb7185)}

    .chart-box { position:relative;height:270px; }
    .chart-box canvas { width:100%!important;height:100%!important;display:block; }
    .chart-legend { display:flex;gap:7px 14px;flex-wrap:wrap;margin-top:8px; }
    .legend-item { display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted); }
    .legend-dot { width:8px;height:8px;border-radius:50%;background:var(--dot); }
    .donut-center { position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none; }
    .donut-center strong{font-size:16px}.donut-center span{font-size:9px;color:var(--muted);margin-top:2px}

    .calendar { user-select:none; }
    .calendar-head { display:flex;justify-content:space-between;align-items:center;margin-bottom:14px; }
    .calendar-title{text-align:center}.calendar-title strong{display:block;font-size:14px}.calendar-title span{font-size:9px;color:var(--muted)}
    .weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays span{text-align:center;font-size:9px;color:var(--muted);padding:4px}.calendar-day{aspect-ratio:1;border:0;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;display:grid;place-content:center;gap:1px;transition:.2s;font-size:11px}.calendar-day small{font-size:7px;color:var(--faint)}.calendar-day:hover{background:var(--surface-soft)}.calendar-day.today{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:white;box-shadow:0 8px 18px rgba(91,92,240,.24)}.calendar-day.today small{color:rgba(255,255,255,.72)}.calendar-day.has-tx::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--success);margin:1px auto 0}.calendar-day.today::after{background:white}.calendar-blank{aspect-ratio:1}

    .goal-ring { width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ring,var(--accent)) calc(var(--p)*1%),rgba(127,138,160,.14) 0);position:relative;flex:0 0 auto}.goal-ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface-strong)}.goal-ring strong{position:relative;z-index:1;font-size:12px}.goal-card-body{display:flex;gap:14px;align-items:center}.goal-info{min-width:0;flex:1}.goal-title{font-weight:800;font-size:14px}.goal-due{font-size:10px;color:var(--muted);margin-top:3px}.goal-values{font-size:11px;margin-top:10px;color:var(--muted)}

    .installment-timeline { position:relative;padding-right:18px;display:grid;gap:12px; }
    .installment-timeline::before{content:"";position:absolute;right:5px;top:8px;bottom:8px;width:2px;background:var(--border-soft)}
    .timeline-item{position:relative;padding:11px 13px;border-radius:15px;background:var(--surface-soft);border:1px solid var(--border-soft)}
    .timeline-item::before{content:"";position:absolute;right:-17px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:3px solid var(--surface-strong);box-shadow:0 0 0 1px var(--border-soft)}
    .timeline-item.paid::before{background:var(--success)}.timeline-item.overdue::before{background:var(--danger)}

    .settings-list { display:grid;gap:10px; }

  (() => {

                <div class="card-header"><div><h3 class="card-title">ثبت سریع</h3><p class="card-subtitle">عملیات پرکاربرد</p></div></div>
                <div class="quick-actions">
                  <button class="quick-action" data-add-tx="income"><i class="qicon q-income">${icons.income}</i><span>درآمد</span></button>
                  <button class="quick-action" data-add-tx="expense"><i class="qicon q-expense">${icons.expense}</i><span>هزینه</span></button>
                  <button class="quick-action" data-add-tx="transfer"><i class="qicon q-transfer">${icons.transfer}</i><span>انتقال</span></button>
                </div>
              </section>
              <section class="card glass calendar" id="calendarCard">${renderCalendar()}</section>
              <section class="card glass">
                <div class="card-header"><div><h3 class="card-title">اقساط نزدیک</h3><p class="card-subtitle">سررسیدهای آینده</p></div><button class="btn btn-sm btn-ghost" data-nav="installments">همه</button></div>
                ${upcoming.length?`<div class="installment-timeline">${upcoming.map(upcomingRow).join('')}</div>`:`<div class="empty" style="padding:18px"><p>قسط نزدیک یا عقب‌افتاده‌ای وجود ندارد.</p></div>`}
              </section>
            </div>
          </div>`;
      },

      transactions(){
        const txs=getFilteredTransactions();
        return `<section class="card glass">
          <div class="toolbar">
            <div class="search-box">${icons.search}<input id="txSearch" class="field" value="${esc(filters.query)}" placeholder="جست‌وجو در شرح، دسته یا حساب…" /></div>
            ${filterSelect('txTypeFilter',[['all','همه نوع‌ها'],['income','درآمد'],['expense','هزینه'],['transfer','انتقال']],filters.type)}
            ${filterSelect('txAccountFilter',[['all','همه حساب‌ها'],...state.accounts.map(a=>[a.id,a.name])],filters.account)}
            ${filterSelect('txMonthFilter',[['all','همه تاریخ‌ها'],...recentMonths(12).map(d=>[isoDate(d),formatMonthFa(d)])],filters.month)}
            <button class="btn btn-primary" data-add-tx="expense">${icons.plus} تراکنش</button>
          </div>
          <div class="kpi-strip" style="margin-bottom:14px">
            <div class="kpi-pill">تعداد<strong>${formatNumber(txs.length)}</strong></div>
            <div class="kpi-pill">جمع درآمد<strong class="positive">${money(txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0))}</strong></div>
            <div class="kpi-pill">جمع هزینه<strong class="negative">${money(txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0))}</strong></div>
            <div class="kpi-pill">خالص<strong>${money(txs.reduce((s,t)=>s+(t.type==='income'?t.amount:t.type==='expense'?-t.amount:0),0))}</strong></div>
          </div>
          ${txs.length?transactionTable(txs):emptyState('تراکنشی پیدا نشد','فیلترها را تغییر دهید یا یک تراکنش جدید ثبت کنید.',`<button class="btn btn-primary btn-sm" data-add-tx="expense">ثبت تراکنش</button>`)}
        </section>`;
      },

      accounts(){
        return `<div class="toolbar"><button class="btn btn-primary" id="addAccountBtn">${icons.plus} حساب جدید</button></div>
          <div class="grid grid-3">
            ${state.accounts.map(accountCard).join('')}
            <button class="card glass" id="addAccountCard" style="min-height:160px;border-style:dashed;cursor:pointer;display:grid;place-content:center;text-align:center;color:var(--muted)"><span class="empty-icon" style="width:48px;height:48px;margin-bottom:8px">${icons.plus}</span><strong>افزودن حساب</strong></button>
          </div>
          <section class="card glass" style="margin-top:16px">
            <div class="card-header"><div><h3 class="card-title">توزیع دارایی</h3><p class="card-subtitle">سهم هر حساب از ارزش خالص</p></div><strong>${money(netWorth())}</strong></div>
            <div class="chart-box" style="height:230px"><canvas id="accountsChart"></canvas></div>
          </section>`;
      },

      categories(){
        return `<div class="grid grid-2">
          ${categorySection('expense','دسته‌های هزینه','برای مرتب‌سازی مخارج')}
          ${categorySection('income','دسته‌های درآمد','برای مرتب‌سازی دریافتی‌ها')}
        </div>`;
      },

      budgets(){
        const budgets=state.budgets;
        return `<div class="toolbar"><button class="btn btn-primary" id="addBudgetBtn">${icons.plus} بودجه جدید</button></div>
          ${budgets.length?`<div class="grid grid-3">${budgets.map(budgetCard).join('')}</div>`:emptyCard('بودجه‌ای تعریف نشده','برای کنترل هزینه‌های ماهانه، برای هر دسته سقف بودجه تعیین کنید.',`<button class="btn btn-primary" id="addBudgetEmpty">ایجاد بودجه</button>`)}
          <section class="card glass" style="margin-top:16px"><div class="card-header"><div><h3 class="card-title">وضعیت بودجه‌های ماه جاری</h3><p class="card-subtitle">مقایسه سقف و مصرف واقعی</p></div></div><div class="chart-box"><canvas id="budgetChart"></canvas></div></section>`;
      },

      goals(){
        return `<div class="toolbar"><button class="btn btn-primary" id="addGoalBtn">${icons.plus} هدف جدید</button></div>
          ${state.goals.length?`<div class="grid grid-3">${state.goals.map(goalCard).join('')}</div>`:emptyCard('هنوز هدفی ندارید','برای خرید، سفر یا پس‌انداز آینده یک هدف مالی بسازید.',`<button class="btn btn-primary" id="addGoalEmpty">ساخت هدف</button>`)}
        `;
      },

      installments(){
        const upcoming=getUpcomingInstallments();
        return `<div class="toolbar"><button class="btn btn-primary" id="addInstallmentBtn">${icons.plus} قرارداد قسطی جدید</button></div>
          <div class="grid grid-4">
            ${statCard('مجموع تعهد',state.installments.reduce((s,i)=>s+i.installmentAmount*Math.max(0,i.count-i.paidCount),0),icons.installments,'var(--accent)','var(--accent-soft)','مانده اقساط')}
            ${statCard('سررسید ۳۰ روز آینده',upcoming.filter(x=>x.days>=0&&x.days<=30).reduce((s,x)=>s+x.amount,0),icons.calendar,'var(--warning)','var(--warning-soft)',`${formatNumber(upcoming.filter(x=>x.days>=0&&x.days<=30).length)} پرداخت`)}
            ${statCard('عقب‌افتاده',upcoming.filter(x=>x.days<0).reduce((s,x)=>s+x.amount,0),icons.info,'var(--danger)','var(--danger-soft)',`${formatNumber(upcoming.filter(x=>x.days<0).length)} پرداخت`)}
            ${statCard('پرداخت‌شده',state.installments.reduce((s,i)=>s+i.installmentAmount*i.paidCount,0),icons.check,'var(--success)','var(--success-soft)','از ابتدای ثبت')}
          </div>
          <div class="grid grid-2" style="margin-top:16px">
            ${state.installments.length?state.installments.map(installmentCard).join(''):emptyCard('قسطی ثبت نشده','اقساط و بدهی‌های دوره‌ای را ثبت کنید تا سررسیدها فراموش نشوند.',`<button class="btn btn-primary" id="addInstallmentEmpty">ثبت قسط</button>`)}
          </div>`;
      },

      analytics(){
        const [start,end]=currentMonthRange(); const income=sumByType('income',start,end); const expense=sumByType('expense',start,end);
        const savingsRate=income?((income-expense)/income)*100:0;
        return `<div class="grid grid-4">
          ${statCard('میانگین هزینه روزانه',expense/new Date().getDate(),icons.expense,'var(--danger)','var(--danger-soft)','ماه جاری')}
          ${statCard('نرخ پس‌انداز',savingsRate,icons.goals,savingsRate>=0?'var(--success)':'var(--danger)',savingsRate>=0?'var(--success-soft)':'var(--danger-soft)','درصد از درآمد',savingsRate>=0?'positive':'negative',true)}
          ${statCard('بیشترین دسته هزینه',topExpenseCategory()?.amount||0,icons.categories,'var(--warning)','var(--warning-soft)',topExpenseCategory()?.name||'بدون داده')}
          ${statCard('تعداد تراکنش ماه',state.transactions.filter(t=>t.date>=start&&t.date<=end).length,icons.transactions,'var(--info)','rgba(22,135,217,.12)','مورد',null,true)}
        </div>
        <div class="grid grid-2" style="margin-top:16px">
          <section class="card glass"><div class="card-header"><div><h3 class="card-title">درآمد و هزینه ۱۲ ماهه</h3><p class="card-subtitle">روند بلندمدت جریان نقدی</p></div></div><div class="chart-box"><canvas id="analyticsFlowChart"></canvas></div></section>
          <section class="card glass"><div class="card-header"><div><h3 class="card-title">ترکیب هزینه ماه جاری</h3><p class="card-subtitle">سهم دسته‌ها از کل مخارج</p></div></div><div class="chart-box"><canvas id="expenseDonut"></canvas><div class="donut-center"><strong>${money(expense,{compact:true})}</strong><span>کل هزینه</span></div></div><div id="expenseLegend" class="chart-legend"></div></section>
          <section class="card glass"><div class="card-header"><div><h3 class="card-title">رفتار هفتگی</h3><p class="card-subtitle">مجموع هزینه بر اساس روز هفته</p></div></div><div class="chart-box"><canvas id="weekdayChart"></canvas></div></section>
          <section class="card glass"><div class="card-header"><div><h3 class="card-title">شاخص‌های مالی</h3><p class="card-subtitle">خلاصه وضعیت فعلی</p></div></div>${financialHealth()}</section>
        </div>`;
      },

      settings(){
        return `<div class="grid grid-2">
          <section class="card glass"><div class="card-header"><div><h3 class="card-title">ظاهر و نمایش</h3><p class="card-subtitle">شخصی‌سازی تجربه برنامه</p></div></div>
            <div class="settings-list">
              <div class="setting-row"><div><h4>حالت نمایش</h4><p>روشن، تیره یا هماهنگ با دستگاه</p></div><div class="segmented" id="themeSegments">${['light','dark','auto'].map(t=>`<button class="segment ${state.settings.theme===t?'active':''}" data-theme-set="${t}">${({light:'روشن',dark:'تیره',auto:'خودکار'}[t])}</button>`).join('')}</div></div>
              <div class="setting-row"><div><h4>واحد اصلی پول</h4><p>مبالغ ورودی و نمایشی با این واحد هستند</p></div><div class="segmented">${['toman','rial'].map(c=>`<button class="segment ${state.settings.currency===c?'active':''}" data-currency-set="${c}">${c==='toman'?'تومان':'ریال'}</button>`).join('')}</div></div>
              <div class="setting-row"><div><h4>نمایش واحد دوم</h4><p>مقدار معادل تومان یا ریال زیر مبلغ اصلی</p></div><label class="switch"><input id="secondaryToggle" type="checkbox" ${state.settings.showSecondary?'checked':''}><span></span></label></div>
              <div class="setting-row"><div><h4>صفحه شروع</h4><p>نمای پیش‌فرض هنگام باز شدن برنامه</p></div><select class="select" id="startPageSelect" style="width:170px">${navItems.map(([id,label])=>`<option value="${id}" ${state.settings.startPage===id?'selected':''}>${label}</option>`).join('')}</select></div>
            </div>
          </section>
          <section class="card glass"><div class="card-header"><div><h3 class="card-title">داده و پشتیبان</h3><p class="card-subtitle">خروجی، بازیابی و انتقال اطلاعات</p></div></div>
            <div class="settings-list">
              <button class="setting-row" id="exportCsvBtn" style="cursor:pointer;text-align:right"><div><h4>خروجی سی‌اس‌وی</h4><p>مناسب برای تحلیل تراکنش‌ها</p></div>${icons.download}</button>
              <button class="setting-row" id="exportExcelBtn" style="cursor:pointer;text-align:right"><div><h4>خروجی اکسل</h4><p>فایل چندبرگی سازگار با اکسل</p></div>${icons.download}</button>
              <button class="setting-row" id="backupBtn" style="cursor:pointer;text-align:right"><div><h4>پشتیبان جیسون</h4><p>نسخه کامل همه حساب‌ها و تنظیمات</p></div>${icons.database}</button>
              <button class="setting-row" id="importBtn" style="cursor:pointer;text-align:right"><div><h4>بازیابی پشتیبان</h4><p>جایگزینی اطلاعات با یک فایل پشتیبان جیسون</p></div>${icons.upload}</button>
            </div>
          </section>
          <section class="card glass span-2"><div class="card-header"><div><h3 class="card-title">خلاصه داده‌ها</h3><p class="card-subtitle">همه اطلاعات فقط در همین مرورگر ذخیره می‌شوند</p></div><span class="badge info">نسخه ${toFa(SCHEMA_VERSION)}</span></div>
            <div class="grid grid-4">
              <div class="stat-card" style="min-height:auto"><div class="stat-label">حساب‌ها</div><div class="stat-value">${formatNumber(state.accounts.length)}</div></div>
              <div class="stat-card" style="min-height:auto"><div class="stat-label">تراکنش‌ها</div><div class="stat-value">${formatNumber(state.transactions.length)}</div></div>
              <div class="stat-card" style="min-height:auto"><div class="stat-label">بودجه‌ها</div><div class="stat-value">${formatNumber(state.budgets.length)}</div></div>
              <div class="stat-card" style="min-height:auto"><div class="stat-label">هدف‌ها</div><div class="stat-value">${formatNumber(state.goals.length)}</div></div>
            </div>
            <div class="form-actions"><button class="btn btn-danger" id="resetAllBtn">${icons.trash} حذف همه اطلاعات</button></div>
          </section>
        </div>`;
      }
    };

    function statCard(label,value,icon,tone,tint,meta,valueClass='',asNumber=false){
      return `<section class="card glass stat-card" style="--tone:${tone};--tint:${tint}"><div class="stat-icon">${icon}</div><div class="stat-label">${label}</div><div class="stat-value ${valueClass||''}">${asNumber?formatNumber(value):money(value)}</div><div class="stat-meta">${meta||''}</div></section>`;
    }
    function emptyState(title,text,action=''){ return `<div class="empty"><div class="empty-icon">${icons.wallet}</div><h3>${title}</h3><p>${text}</p>${action}</div>`; }
    function emptyCard(title,text,action=''){ return `<section class="card glass">${emptyState(title,text,action)}</section>`; }
    function filterSelect(id,options,value){ return `<select class="select filter-select" id="${id}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select>`; }
    function transactionRow(t){
      const d=getTxDisplay(t); const amountClass=t.type==='income'?'positive':t.type==='expense'?'negative':''; const prefix=t.type==='income'?'+':t.type==='expense'?'-':'';
      return `<div class="list-row"><div class="row-icon" style="--icon-bg:${d.bg};--icon-color:${d.color}">${d.icon}</div><div class="row-main"><div class="row-title">${esc(d.title)}</div><div class="row-sub">${esc(d.subtitle)} • ${formatFaDateShort(t.date)}</div></div><div class="row-side"><div class="row-amount ${amountClass}">${prefix}${money(t.amount)}</div><div class="row-secondary">${secondaryMoney(t.amount)}</div></div><div class="row-actions"><button class="mini-btn" data-edit-tx="${t.id}" aria-label="ویرایش">${icons.edit}</button><button class="mini-btn danger" data-delete-tx="${t.id}" aria-label="حذف">${icons.trash}</button></div></div>`;
    }
    function transactionTable(txs){
      return `<div class="table-wrap"><table><thead><tr><th>نوع</th><th>شرح</th><th>حساب</th><th>دسته</th><th>تاریخ</th><th>مبلغ</th><th></th></tr></thead><tbody>${txs.map(t=>{const d=getTxDisplay(t),a=accountById(t.accountId),c=categoryById(t.categoryId);return `<tr><td><span class="badge ${t.type==='income'?'success':t.type==='expense'?'danger':'info'}">${typeLabel(t.type)}</span></td><td>${esc(d.title)}</td><td>${esc(a?.name||'حذف‌شده')}</td><td>${esc(c?.name||'—')}</td><td title="${formatGregorian(t.date)}">${formatFaDateShort(t.date)}</td><td class="${t.type==='income'?'positive':t.type==='expense'?'negative':''}" style="font-weight:850">${t.type==='income'?'+':t.type==='expense'?'-':''}${money(t.amount)}</td><td><div class="row-actions" style="opacity:1"><button class="mini-btn" data-edit-tx="${t.id}">${icons.edit}</button><button class="mini-btn danger" data-delete-tx="${t.id}">${icons.trash}</button></div></td></tr>`}).join('')}</tbody></table></div>`;
    }
    function accountCard(a){ const bal=accountBalance(a.id); return `<section class="card account-card" style="--card-color:${a.color}"><div class="account-top"><div><div class="account-name">${esc(a.name)}</div><div class="account-kind">${accountTypeLabel(a.type)}</div></div><div class="account-symbol">${a.icon||'💳'}</div></div><div class="account-balance">${money(bal)}</div><div class="account-bottom"><span>${secondaryMoney(bal)}</span><span><button class="mini-btn" style="color:white;background:rgba(255,255,255,.12)" data-edit-account="${a.id}">${icons.edit}</button><button class="mini-btn" style="color:white;background:rgba(255,255,255,.12)" data-delete-account="${a.id}">${icons.trash}</button></span></div></section>`; }
    function categorySection(type,title,subtitle){ const cats=state.categories[type]; return `<section class="card glass"><div class="card-header"><div><h3 class="card-title">${title}</h3><p class="card-subtitle">${subtitle}</p></div><button class="btn btn-sm" data-add-category="${type}">${icons.plus} افزودن</button></div><div class="list">${cats.map(c=>`<div class="list-row"><div class="row-icon" style="--icon-bg:${c.color}22;--icon-color:${c.color}">${c.icon}</div><div class="row-main"><div class="row-title">${esc(c.name)}</div><div class="row-sub">${formatNumber(state.transactions.filter(t=>t.categoryId===c.id).length)} تراکنش</div></div><div class="row-actions"><button class="mini-btn" data-edit-category="${c.id}" data-category-type="${type}">${icons.edit}</button><button class="mini-btn danger" data-delete-category="${c.id}" data-category-type="${type}">${icons.trash}</button></div></div>`).join('')}</div></section>`; }
    function budgetCard(b){ const c=categoryById(b.categoryId); const spent=budgetSpent(b); const p=b.amount?clamp(spent/b.amount*100,0,100):0; const over=spent>b.amount; return `<section class="card glass budget-card ${over?'over':''}"><div class="card-header"><div style="display:flex;gap:10px;align-items:center"><div class="row-icon" style="--icon-bg:${c?.color||'#64748b'}22;--icon-color:${c?.color||'#64748b'}">${c?.icon||'🧾'}</div><div><h3 class="card-title">${esc(c?.name||'دسته حذف‌شده')}</h3><p class="card-subtitle">بودجه ماهانه</p></div></div><div class="row-actions" style="opacity:1"><button class="mini-btn" data-edit-budget="${b.id}">${icons.edit}</button><button class="mini-btn danger" data-delete-budget="${b.id}">${icons.trash}</button></div></div><div class="meter"><div class="meter-head"><span>${money(spent)} مصرف‌شده</span><strong>${formatNumber(spent/b.amount*100||0)}٪</strong></div><div class="meter-track"><div class="meter-fill" style="--meter-color:${c?.color||'var(--accent)'};width:${p}%"></div></div></div><div class="row-sub" style="margin-top:9px">${over?`<span class="negative">${money(spent-b.amount)} بیشتر از بودجه</span>`:`${money(b.amount-spent)} باقی‌مانده از ${money(b.amount)}`}</div></section>`; }
    function goalCard(g){ const p=g.target?clamp(g.current/g.target*100,0,100):0; const remain=Math.max(0,g.target-g.current); return `<section class="card glass"><div class="card-header"><span class="badge">${g.icon||'🎯'} هدف مالی</span><div class="row-actions" style="opacity:1"><button class="mini-btn" data-contribute-goal="${g.id}" title="افزایش پس‌انداز">${icons.plus}</button><button class="mini-btn" data-edit-goal="${g.id}">${icons.edit}</button><button class="mini-btn danger" data-delete-goal="${g.id}">${icons.trash}</button></div></div><div class="goal-card-body"><div class="goal-ring" style="--p:${p};--ring:${g.color||'var(--accent)'}"><strong>${formatNumber(p)}٪</strong></div><div class="goal-info"><div class="goal-title">${esc(g.title)}</div><div class="goal-due">${g.dueDate?`تا ${formatFaDate(g.dueDate)} • ${formatGregorian(g.dueDate)}`:'بدون تاریخ پایان'}</div><div class="goal-values"><strong>${money(g.current)}</strong> از ${money(g.target)}<br>${remain?`${money(remain)} باقی‌مانده`:'هدف تکمیل شده است'}</div></div></div></section>`; }
    function installmentCard(i){ const pct=i.count?clamp(i.paidCount/i.count*100,0,100):0; const next=getNextInstallment(i); return `<section class="card glass"><div class="card-header"><div><h3 class="card-title">${esc(i.title)}</h3><p class="card-subtitle">${formatNumber(i.paidCount)} از ${formatNumber(i.count)} قسط پرداخت شده</p></div><div class="row-actions" style="opacity:1"><button class="mini-btn" data-edit-installment="${i.id}">${icons.edit}</button><button class="mini-btn danger" data-delete-installment="${i.id}">${icons.trash}</button></div></div><div class="meter"><div class="meter-head"><span>${money(i.installmentAmount)} هر قسط</span><strong>${formatNumber(pct)}٪</strong></div><div class="meter-track"><div class="meter-fill" style="width:${pct}%"></div></div></div><div class="setting-row" style="margin-top:13px;padding:11px;flex-direction:row;align-items:center"><div><h4>${next?`سررسید بعد: ${formatFaDate(next.date)}`:'همه اقساط پرداخت شده'}</h4><p>${next?formatGregorian(next.date):money(i.installmentAmount*i.count)}</p></div>${next?`<button class="btn btn-success btn-sm" data-pay-installment="${i.id}">${icons.check} ثبت پرداخت</button>`:'<span class="badge success">تکمیل</span>'}</div></section>`; }
    function upcomingRow(x){ return `<div class="timeline-item ${x.days<0?'overdue':x.days===0?'due':''}"><div style="display:flex;justify-content:space-between;gap:8px"><strong style="font-size:11px">${esc(x.title)}</strong><span class="${x.days<0?'negative':''}" style="font-size:10px;font-weight:800">${money(x.amount)}</span></div><div class="row-sub">${x.days<0?`${formatNumber(Math.abs(x.days))} روز عقب‌افتاده`:x.days===0?'امروز':`${formatNumber(x.days)} روز دیگر`} • ${formatFaDateShort(x.date)}</div></div>`; }
    function financialHealth(){
      const [s,e]=currentMonthRange(); const income=sumByType('income',s,e), expense=sumByType('expense',s,e), ratio=income?expense/income:0; const budgetTotal=state.budgets.reduce((x,b)=>x+b.amount,0), budgetUsed=state.budgets.reduce((x,b)=>x+budgetSpent(b),0); const goalTotal=state.goals.reduce((x,g)=>x+g.target,0), goalCurrent=state.goals.reduce((x,g)=>x+g.current,0);
      const rows=[['نسبت هزینه به درآمد',ratio*100,ratio<=.7?'var(--success)':ratio<=1?'var(--warning)':'var(--danger)'],['مصرف بودجه‌ها',budgetTotal?budgetUsed/budgetTotal*100:0,budgetUsed<=budgetTotal?'var(--accent)':'var(--danger)'],['پیشرفت هدف‌ها',goalTotal?goalCurrent/goalTotal*100:0,'var(--success)']];

    }

    function getFilteredTransactions(){
      const q=filters.query.trim().toLowerCase();
      return [...state.transactions].filter(t=>{
        const d=getTxDisplay(t); const hay=`${d.title} ${d.subtitle} ${typeLabel(t.type)} ${formatFaDate(t.date)} ${formatGregorian(t.date)}`.toLowerCase();
        return (!q||hay.includes(q)) && (filters.type==='all'||t.type===filters.type) && (filters.account==='all'||t.accountId===filters.account||t.toAccountId===filters.account) && (filters.category==='all'||t.categoryId===filters.category) && (filters.month==='all'||(()=>{const [ms,me]=persianMonthRange(parseDate(filters.month));return t.date>=ms&&t.date<=me})());
      }).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));
    }
    function recentMonths(count){ return Array.from({length:count},(_,i)=>shiftPersianStart(new Date(),-i)); }
    function budgetSpent(b){ const [s,e]=currentMonthRange(); return state.transactions.filter(t=>t.type==='expense'&&t.categoryId===b.categoryId&&t.date>=s&&t.date<=e).reduce((x,t)=>x+t.amount,0); }
    function topExpenseCategory(){ const [s,e]=currentMonthRange(); const map={}; state.transactions.filter(t=>t.type==='expense'&&t.date>=s&&t.date<=e).forEach(t=>map[t.categoryId]=(map[t.categoryId]||0)+t.amount); const top=Object.entries(map).sort((a,b)=>b[1]-a[1])[0]; if(!top)return null; return {name:categoryById(top[0])?.name||'بدون دسته',amount:top[1]}; }
    function getNextInstallment(i){ if(i.paidCount>=i.count)return null; const start=parseDate(i.startDate); const due=addMonths(start,i.paidCount); const maxDay=new Date(due.getFullYear(),due.getMonth()+1,0).getDate(); due.setDate(Math.min(num(i.dayOfMonth)||start.getDate(),maxDay)); return {date:isoDate(due),index:i.paidCount+1}; }
    function getUpcomingInstallments(){ return state.installments.map(i=>{const n=getNextInstallment(i);return n?{...n,id:i.id,title:i.title,amount:i.installmentAmount,days:daysBetween(todayISO(),n.date)}:null}).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date)); }

    function renderCalendar(){
      const targetParts=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric'}).formatToParts(calendarAnchor); const py=+targetParts.find(x=>x.type==='year').value, pm=+targetParts.find(x=>x.type==='month').value;
      let cursor=new Date(calendarAnchor); cursor.setHours(12,0,0,0);
      for(let i=0;i<35;i++){const p=persianParts(cursor);if(p.year===py&&p.month===pm&&p.day===1)break;cursor.setDate(cursor.getDate()-1)}
      const first=new Date(cursor); const jsDay=(first.getDay()+1)%7; // شنبه=۰
      const days=[]; let d=new Date(first);
      while(true){ const p=persianParts(d); if(p.month!==pm||p.year!==py)break; const iso=isoDate(d); const has=state.transactions.some(t=>t.date===iso); days.push(`<button class="calendar-day ${iso===todayISO()?'today':''} ${has?'has-tx':''}" data-calendar-date="${iso}" title="${formatGregorian(iso)}"><span>${toFa(p.day)}</span><small>${toFa(d.getDate())}</small></button>`); d.setDate(d.getDate()+1); }
      return `<div class="calendar-head"><button class="icon-btn" id="calNext">${icons.chevronRight}</button><div class="calendar-title"><strong>${formatMonthFa(first)}</strong><span>${formatMonthGr(first)}</span></div><button class="icon-btn" id="calPrev">${icons.chevronLeft}</button></div><div class="weekdays">${['ش','ی','د','س','چ','پ','ج'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-grid">${'<i class="calendar-blank"></i>'.repeat(jsDay)}${days.join('')}</div>`;
    }
    function persianParts(date){ const p=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(date); return {year:+p.find(x=>x.type==='year').value,month:+p.find(x=>x.type==='month').value,day:+p.find(x=>x.type==='day').value}; }
    function shiftPersianMonth(dir){
      let first=new Date(calendarAnchor); first.setHours(12,0,0,0);
      for(let i=0;i<35 && persianParts(first).day!==1;i++) first.setDate(first.getDate()-1);
      if(dir>0){
        first.setDate(first.getDate()+32);
        for(let i=0;i<35 && persianParts(first).day!==1;i++) first.setDate(first.getDate()-1);
      }else{
        first.setDate(first.getDate()-1);
        for(let i=0;i<35 && persianParts(first).day!==1;i++) first.setDate(first.getDate()-1);
      }
      calendarAnchor=first; const card=$('#calendarCard'); if(card)card.innerHTML=renderCalendar(); bindCalendarEvents();
    }

    function pushUndo(label,action){ undoStack.push({label,action}); if(undoStack.length>MAX_UNDO)undoStack.shift(); }

    function toast(title,text='',type='info',showUndo=false){
      const id=uid('toast');const el=document.createElement('div');el.className='toast glass';el.dataset.toast=id;el.innerHTML=`<div class="toast-icon">${type==='success'?icons.check:type==='danger'?icons.trash:icons.info}</div><div class="toast-body"><div class="toast-title">${esc(title)}</div><div class="toast-text">${esc(text)}</div></div>${showUndo?'<button class="toast-action">بازگردانی</button>':''}<button class="toast-close">${icons.close}</button>`;$('#toastStack').appendChild(el);const remove=()=>{el.style.opacity='0';el.style.transform='translateX(-12px)';setTimeout(()=>el.remove(),220);const t=activeToastTimers.get(id);clearTimeout(t);activeToastTimers.delete(id)};$('.toast-close',el).onclick=remove;if(showUndo)$('.toast-action',el).onclick=()=>{undoLast();remove()};activeToastTimers.set(id,setTimeout(remove,5200)); }

    function setupCanvas(id){ const canvas=$(`#${id}`);if(!canvas)return null;const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,rect.width*dpr);canvas.height=Math.max(1,rect.height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);return {ctx,w:rect.width,h:rect.height}; }
    function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
    function roundedRect(ctx,x,y,w,h,r){ const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath(); }
    function drawCashflow(id,count){ const c=setupCanvas(id);if(!c)return;const {ctx,w,h}=c;const pad={t:18,r:20,b:36,l:20};const months=recentMonths(count).reverse();const data=months.map(d=>{const [s,e]=persianMonthRange(d);return {label:new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'short'}).format(d),income:sumByType('income',s,e),expense:sumByType('expense',s,e)}});const max=Math.max(1,...data.flatMap(x=>[x.income,x.expense]));ctx.clearRect(0,0,w,h);ctx.font='10px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='middle';const plotH=h-pad.t-pad.b,step=(w-pad.l-pad.r)/Math.max(data.length,1);ctx.strokeStyle=css('--border-soft');ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=pad.t+plotH*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke()}data.forEach((d,i)=>{const center=pad.l+step*(i+.5),bw=Math.min(18,step*.25);const ih=d.income/max*plotH,eh=d.expense/max*plotH;ctx.fillStyle=css('--success');roundedRect(ctx,center-bw-2,pad.t+plotH-ih,bw,ih,5);ctx.fill();ctx.fillStyle=css('--danger');roundedRect(ctx,center+2,pad.t+plotH-eh,bw,eh,5);ctx.fill();ctx.fillStyle=css('--muted');ctx.fillText(d.label,center,h-14)}); }
    function drawAccountsChart(){ const c=setupCanvas('accountsChart');if(!c)return;const {ctx,w,h}=c;const data=state.accounts.map(a=>({name:a.name,value:Math.max(0,accountBalance(a.id)),color:a.color}));const max=Math.max(1,...data.map(x=>x.value));ctx.clearRect(0,0,w,h);const rowH=h/Math.max(data.length,1);ctx.font='10px Vazirmatn';ctx.textAlign='right';ctx.textBaseline='middle';data.forEach((d,i)=>{const y=i*rowH+rowH/2;ctx.fillStyle=css('--border-soft');roundedRect(ctx,110,y-7,w-140,14,7);ctx.fill();ctx.fillStyle=d.color;roundedRect(ctx,110,y-7,(w-140)*d.value/max,14,7);ctx.fill();ctx.fillStyle=css('--text');ctx.fillText(d.name,98,y);ctx.textAlign='left';ctx.fillText(money(d.value,{compact:true}),w-8,y);ctx.textAlign='right'}); }
    function drawBudgetChart(){ const c=setupCanvas('budgetChart');if(!c)return;const {ctx,w,h}=c;const data=state.budgets.map(b=>{const cat=categoryById(b.categoryId);return{name:cat?.name||'—',budget:b.amount,spent:budgetSpent(b),color:cat?.color||css('--accent')}});const max=Math.max(1,...data.flatMap(x=>[x.budget,x.spent]));ctx.clearRect(0,0,w,h);if(!data.length){ctx.fillStyle=css('--muted');ctx.font='12px Vazirmatn';ctx.textAlign='center';ctx.fillText('برای نمایش نمودار، یک بودجه ایجاد کنید.',w/2,h/2);return}const pad=28,step=(w-pad*2)/data.length;ctx.font='9px Vazirmatn';ctx.textAlign='center';data.forEach((d,i)=>{const x=pad+step*(i+.5),base=h-35,bw=Math.min(22,step*.3),bh=(h-60)*d.budget/max,sh=(h-60)*d.spent/max;ctx.fillStyle=css('--border-soft');roundedRect(ctx,x-bw-2,base-bh,bw,bh,6);ctx.fill();ctx.fillStyle=d.spent>d.budget?css('--danger'):d.color;roundedRect(ctx,x+2,base-sh,bw,sh,6);ctx.fill();ctx.fillStyle=css('--muted');ctx.fillText(d.name.slice(0,10),x,h-16)}); }

    function drawExpenseDonut(){ const c=setupCanvas('expenseDonut');if(!c)return;const {ctx,w,h}=c;const data=expenseData(),total=data.reduce((s,x)=>s+x.value,0);ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2,r=Math.min(w,h)*.35,inner=r*.65;let a=-Math.PI/2;if(!total){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.arc(cx,cy,inner,0,Math.PI*2,true);ctx.fillStyle=css('--border-soft');ctx.fill('evenodd')}else data.forEach(d=>{const end=a+d.value/total*Math.PI*2;ctx.beginPath();ctx.arc(cx,cy,r,a,end);ctx.arc(cx,cy,inner,end,a,true);ctx.closePath();ctx.fillStyle=d.color;ctx.fill();a=end});$('#expenseLegend').innerHTML=data.slice(0,8).map(d=>`<div class="legend-item"><i class="legend-dot" style="--dot:${d.color}"></i>${esc(d.name)} ${formatNumber(d.value/total*100||0)}٪</div>`).join(''); }

    }

    function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'){if(quoted&&next==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}

    function rowsToTransactions(rows){if(rows.length<2)return[];const headers=rows[0].map(normalizedText);const idx=(...names)=>headers.findIndex(h=>names.some(n=>h.includes(normalizedText(n))));const iType=idx('نوع','type'),iDesc=idx('شرح','description'),iNotes=idx('یادداشت','notes'),iFrom=idx('حسابمبدا','حساب','account'),iTo=idx('حسابمقصد','toaccount'),iCat=idx('دسته','category'),iDate=idx('تاریخمیلادی','date'),iAmount=idx('مبلغتومان','amounttoman','amount');return rows.slice(1).map(r=>{const type=importedType(r[iType]),from=findOrCreateAccount(r[iFrom]),to=type==='transfer'?findOrCreateAccount(r[iTo]):null,cat=findOrCreateCategory(r[iCat],type),date=/^\d{4}-\d{2}-\d{2}$/.test(r[iDate]||'')?r[iDate]:todayISO(),amount=Math.abs(num(r[iAmount]));if(!amount)return null;return{id:uid('tx'),type,amount,enteredCurrency:'toman',accountId:from.id,toAccountId:to?.id||null,categoryId:cat?.id||null,description:(r[iDesc]||typeLabel(type)).trim(),notes:(r[iNotes]||'').trim(),note:(r[iDesc]||typeLabel(type)).trim(),date,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}).filter(Boolean)}
    function parseExcelXml(text){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('ساختار اکسل معتبر نیست');const sheets=[...doc.getElementsByTagNameNS('*','Worksheet')];const result={};for(const sheet of sheets){const name=sheet.getAttribute('ss:Name')||sheet.getAttribute('Name')||'برگه';const rows=[...sheet.getElementsByTagNameNS('*','Row')].map(row=>[...row.getElementsByTagNameNS('*','Cell')].map(cell=>cell.getElementsByTagNameNS('*','Data')[0]?.textContent||''));result[name]=rows}return result}
    function excelToState(sheets){const incoming=initialState();incoming.settings={...state.settings};const accounts=sheets['حساب‌ها']||[];if(accounts.length>1)incoming.accounts=accounts.slice(1).map(r=>({id:r[0]||uid('acc'),name:r[1]||'حساب',type:r[2]||'other',initialBalance:num(r[3]),color:r[4]||'#64748b',icon:r[5]||'💳',createdAt:new Date().toISOString()}));const cats=sheets['دسته‌بندی‌ها']||[];if(cats.length>1){incoming.categories={income:[],expense:[]};cats.slice(1).forEach(r=>incoming.categories[r[1]==='income'?'income':'expense'].push({id:r[0]||uid('cat'),name:r[2]||'سایر',icon:r[3]||'•',color:r[4]||'#64748b'}))}const tx=sheets['تراکنش‌ها']||[];if(tx.length>1)incoming.transactions=tx.slice(1).map(r=>({id:r[0]||uid('tx'),type:r[1]||'expense',description:r[2]||'',notes:r[3]||'',note:r[2]||'',accountId:r[4]||'',toAccountId:r[5]||null,categoryId:r[6]||null,date:r[7]||todayISO(),amount:num(r[8]),enteredCurrency:r[9]||'toman',createdAt:r[10]||new Date().toISOString()})).filter(t=>t.amount>0);const budgets=sheets['بودجه‌ها']||[];if(budgets.length>1)incoming.budgets=budgets.slice(1).map(r=>({id:r[0]||uid('budget'),categoryId:r[1],amount:num(r[2]),createdAt:new Date().toISOString()}));const goals=sheets['هدف‌ها']||[];if(goals.length>1)incoming.goals=goals.slice(1).map(r=>({id:r[0]||uid('goal'),title:r[1],target:num(r[2]),current:num(r[3]),dueDate:r[4]||'',color:r[5]||'#8b5cf6',icon:r[6]||'🎯',createdAt:new Date().toISOString()}));const inst=sheets['اقساط']||[];if(inst.length>1)incoming.installments=inst.slice(1).map(r=>({id:r[0]||uid('inst'),title:r[1],installmentAmount:num(r[2]),count:num(r[3]),paidCount:num(r[4]),accountId:r[5],categoryId:r[6],startDate:r[7]||todayISO(),dayOfMonth:num(r[8])||1,createdAt:new Date().toISOString()}));return migrateState(incoming)}
    exportCSV=function(){const headers=['شناسه','نوع','شرح','یادداشت','حساب مبدا','حساب مقصد','دسته','تاریخ شمسی','تاریخ میلادی','مبلغ تومان','مبلغ ریال'];const rows=state.transactions.map(t=>[t.id,typeLabel(t.type),t.description||t.note||'',t.notes||'',accountById(t.accountId)?.name||'',accountById(t.toAccountId)?.name||'',categoryById(t.categoryId)?.name||'',formatFaDate(t.date),t.date,t.amount,t.amount*10]);const csv='\ufeff'+[headers,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');downloadBlob(csv,'text/csv;charset=utf-8',`تراکنش‌ها-${todayISO()}.csv`);toast('خروجی سی‌اس‌وی آماده شد','همهٔ تراکنش‌ها با ساختار قابل واردسازی ذخیره شدند.','success')};
    exportExcel=function(){const tx=[['شناسه','نوع','شرح','یادداشت','حساب مبدا','حساب مقصد','دسته','تاریخ','مبلغ تومان','واحد ورود','زمان ایجاد'],...state.transactions.map(t=>[t.id,t.type,t.description||t.note||'',t.notes||'',t.accountId,t.toAccountId||'',t.categoryId||'',t.date,t.amount,t.enteredCurrency||'toman',t.createdAt||''])];const ac=[['شناسه','نام','نوع','موجودی اولیه تومان','رنگ','نماد'],...state.accounts.map(a=>[a.id,a.name,a.type,a.initialBalance,a.color,a.icon])];const ca=[['شناسه','نوع','نام','نماد','رنگ'],...state.categories.income.map(c=>[c.id,'income',c.name,c.icon,c.color]),...state.categories.expense.map(c=>[c.id,'expense',c.name,c.icon,c.color])];const bu=[['شناسه','شناسه دسته','بودجه تومان'],...state.budgets.map(b=>[b.id,b.categoryId,b.amount])];const go=[['شناسه','عنوان','مبلغ هدف تومان','موجودی فعلی تومان','تاریخ هدف','رنگ','نماد'],...state.goals.map(g=>[g.id,g.title,g.target,g.current,g.dueDate||'',g.color,g.icon])];const ins=[['شناسه','عنوان','مبلغ قسط تومان','تعداد','پرداخت شده','شناسه حساب','شناسه دسته','تاریخ شروع','روز سررسید'],...state.installments.map(i=>[i.id,i.title,i.installmentAmount,i.count,i.paidCount,i.accountId,i.categoryId,i.startDate,i.dayOfMonth])];const xml=`<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${excelSheet('تراکنش‌ها',tx)}${excelSheet('حساب‌ها',ac)}${excelSheet('دسته‌بندی‌ها',ca)}${excelSheet('بودجه‌ها',bu)}${excelSheet('هدف‌ها',go)}${excelSheet('اقساط',ins)}</Workbook>`;downloadBlob('\ufeff'+xml,'application/vnd.ms-excel;charset=utf-8',`دارایی-من-${todayISO()}.xls`);toast('خروجی اکسل آماده شد','فایل کامل و قابل بازیابی ساخته شد.','success')};
    importBackupFile=async function(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const text=await file.text(),ext=file.name.toLowerCase().split('.').pop();if(ext==='csv'){const tx=rowsToTransactions(parseCsv(text.replace(/^\ufeff/,'')));if(!tx.length)throw new Error('تراکنشی پیدا نشد');openConfirm('وارد کردن سی‌اس‌وی',`${formatNumber(tx.length)} تراکنش به اطلاعات فعلی افزوده می‌شود. حساب‌ها یا دسته‌های ناشناخته خودکار ساخته می‌شوند.`,'افزودن',()=>{state.transactions.push(...tx);saveState();closeModal();toast('سی‌اس‌وی وارد شد',`${formatNumber(tx.length)} تراکنش اضافه شد.`,'success')});return}if(ext==='xls'||ext==='xml'){const incoming=excelToState(parseExcelXml(text.replace(/^\ufeff/,'')));openConfirm('بازیابی فایل اکسل','همهٔ اطلاعات فعلی با حساب‌ها، تراکنش‌ها، بودجه‌ها، هدف‌ها و اقساط فایل اکسل جایگزین می‌شود.','بازیابی',()=>{state=incoming;ensureProductionSchema();undoStack=[];saveState();closeModal();toast('اکسل بازیابی شد','همهٔ اطلاعات با موفقیت وارد شدند.','success')});return}const parsed=JSON.parse(text),incoming=migrateState(parsed.data||parsed);openConfirm('بازیابی پشتیبان','تمام اطلاعات فعلی با محتوای فایل پشتیبان جیسون جایگزین می‌شود.','بازیابی',()=>{state=incoming;ensureProductionSchema();undoStack=[];saveState();closeModal();toast('پشتیبان بازیابی شد','همهٔ اطلاعات با موفقیت وارد شدند.','success')})}catch(err){console.error(err);toast('فایل قابل وارد کردن نیست','فرمت فایل یا ساختار داده معتبر نیست.','danger')}};

    const originalBindSettings=bindSettings;
    bindSettings=function(){originalBindSettings();$$('[data-theme-set]').forEach(b=>b.onclick=()=>{triggerThemeTransition();state.settings.theme=b.dataset.themeSet;saveState()});$$('[data-accent-set]').forEach(b=>b.onclick=()=>{state.settings.accent=b.dataset.accentSet;saveState()});$('#settingsInstallBtn')?.addEventListener('click',requestInstall)};
    const originalBindCalendarEvents=bindCalendarEvents;
    bindCalendarEvents=function(){
      $('#calPrev')?.addEventListener('click',()=>shiftPersianMonth(-1));$('#calNext')?.addEventListener('click',()=>shiftPersianMonth(1));
      $$('[data-calendar-date]').forEach(b=>b.onclick=()=>{selectedCalendarDate=b.dataset.calendarDate;if(currentView==='calendar')renderApp();else{filters.query=b.dataset.calendarDate;filters.month='all';navigate('transactions')}});
    };
    const originalBindViewEvents=bindViewEvents;
    bindViewEvents=function(){originalBindViewEvents();bindSwipeRows();$$('[data-analytics-period]').forEach(b=>b.onclick=()=>{analyticsPeriod=b.dataset.analyticsPeriod;state.settings.analyticsPeriod=analyticsPeriod;saveState()});$$('[data-add-date-tx]').forEach(b=>b.onclick=()=>{openTransactionModal('expense');setTimeout(()=>{const date=$('#txDate');if(date){date.value=b.dataset.addDateTx;date.dispatchEvent(new Event('change'))}},80)})};
    const originalBindGlobal=bindGlobal;
    bindGlobal=function(){originalBindGlobal();setupPWA()};
    const originalDrawCurrentCharts=drawCurrentCharts;
    drawCurrentCharts=function(){originalDrawCurrentCharts();if(currentView==='analytics'){drawTrendLine();drawCategoryBars()}};
    const originalRenderApp=renderApp;
    renderApp=function(){originalRenderApp();requestAnimationFrame(animateCounters)};


    bindGlobal();
    renderApp();
  })();
  </script>
